<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580" width="440" height="580">
  <defs>
    <filter id="card-shadow" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d262b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 阴影与相纸白卡底色 -->
  <rect x="20" y="20" width="400" height="540" rx="16" fill="#fcfaf6" stroke="#e8e2d5" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- 顶部日系和纸胶带装饰 -->
  <rect x="170" y="10" width="100" height="22" rx="3" fill="#2d525d" opacity="0.82" />

  <!-- 顶部品牌区域 -->
  <g transform="translate(45, 54)">
    <!-- 品牌圆形图标 -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#264e58" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">城</text>
    
    <!-- 标题与英文 -->
    <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif" font-size="16" font-weight="700" fill="#1f2d33" letter-spacing="1">城脉相机</text>
    <text x="42" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#7a8b94" letter-spacing="1.5">CITY MEMORIES · 荆州限定</text>
    
    <!-- 标牌 -->
    <rect x="270" y="4" width="75" height="22" rx="11" fill="#f0eae1" />
    <text x="307" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#9e5638" text-anchor="middle">VOL.001</text>
  </g>

  <!-- 二维码白色衬底与内边框 -->
  <rect x="70" y="112" width="300" height="300" rx="12" fill="#ffffff" stroke="#ede7dc" stroke-width="1" />
  
